model:
  name: "lightgbm_regressor"
  branch: "forecasting/lightgbm-regressor"
  horizons: 24
  target_prefix: "target_h"
  evaluate_final_holdout: false
  random_seed: 42

  tuning:
    representative_horizons: [1, 12, 24]
    parameter_grid:

      - n_estimators: 300
        num_leaves: 31
        learning_rate: 0.05
        max_depth: -1
        min_child_samples: 20
        subsample: 0.8
        colsample_bytree: 0.8
        reg_lambda: 0.0
      - n_estimators: 400
        num_leaves: 63
        learning_rate: 0.05
        max_depth: -1
        min_child_samples: 30
        subsample: 0.8
        colsample_bytree: 0.8
        reg_lambda: 0.5
      - n_estimators: 300
        num_leaves: 63
        learning_rate: 0.08
        max_depth: -1
        min_child_samples: 40
        subsample: 0.9
        colsample_bytree: 0.9
        reg_lambda: 1.0
      - n_estimators: 500
        num_leaves: 31
        learning_rate: 0.03
        max_depth: -1
        min_child_samples: 30
        subsample: 0.9
        colsample_bytree: 0.9
        reg_lambda: 1.0


paths:
  modeling_foundation_config: "configs/modeling_foundation.yaml"
  feature_dataset: "data/processed/feature_dataset.parquet"
  forecast_targets: "data/processed/target_definition/forecast_target_complete.parquet"
  reports_dir: "reports/modeling/forecasting/lightgbm"
  docs_dir: "docs/modeling/forecasting/lightgbm"
  outputs_dir: "outputs/modeling/forecasting/lightgbm"
  figures_dir: "reports/figures/modeling/forecasting/lightgbm"
