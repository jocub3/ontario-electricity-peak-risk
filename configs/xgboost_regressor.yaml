model:
  name: "xgboost_regressor"
  branch: "forecasting/xgboost-regressor"
  horizons: 24
  target_prefix: "target_h"
  evaluate_final_holdout: false
  random_seed: 42

  tuning:
    representative_horizons: [1, 12, 24]
    parameter_grid:

      - n_estimators: 300
        max_depth: 4
        learning_rate: 0.05
        subsample: 0.8
        colsample_bytree: 0.8
        min_child_weight: 3
        reg_lambda: 1.0
      - n_estimators: 400
        max_depth: 6
        learning_rate: 0.05
        subsample: 0.8
        colsample_bytree: 0.8
        min_child_weight: 5
        reg_lambda: 1.0
      - n_estimators: 300
        max_depth: 6
        learning_rate: 0.08
        subsample: 0.9
        colsample_bytree: 0.9
        min_child_weight: 5
        reg_lambda: 2.0
      - n_estimators: 500
        max_depth: 4
        learning_rate: 0.03
        subsample: 0.9
        colsample_bytree: 0.9
        min_child_weight: 3
        reg_lambda: 2.0


paths:
  modeling_foundation_config: "configs/modeling_foundation.yaml"
  feature_dataset: "data/processed/feature_dataset.parquet"
  forecast_targets: "data/processed/target_definition/forecast_target_complete.parquet"
  reports_dir: "reports/modeling/forecasting/xgboost"
  docs_dir: "docs/modeling/forecasting/xgboost"
  outputs_dir: "outputs/modeling/forecasting/xgboost"
  figures_dir: "reports/figures/modeling/forecasting/xgboost"
