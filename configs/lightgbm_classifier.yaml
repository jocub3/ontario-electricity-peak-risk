model:
  name: "lightgbm_classifier"
  branch: "peak-risk/lightgbm-classifier"
  horizons: 24
  target_prefix: "peak_h"
  probability_threshold: 0.50
  peak_percentile: 0.975
  evaluate_final_holdout: false
  random_seed: 42

  tuning:
    representative_horizons: [1, 12, 24]
    selection_metric: "pr_auc"
    parameter_grid:

      - n_estimators: 300
        num_leaves: 31
        learning_rate: 0.05
        max_depth: -1
        min_child_samples: 20
        subsample: 0.8
        colsample_bytree: 0.8
        reg_lambda: 0.0
        imbalance_multiplier: 1.0
      - n_estimators: 400
        num_leaves: 63
        learning_rate: 0.05
        max_depth: -1
        min_child_samples: 30
        subsample: 0.8
        colsample_bytree: 0.8
        reg_lambda: 0.5
        imbalance_multiplier: 1.0
      - n_estimators: 300
        num_leaves: 63
        learning_rate: 0.08
        max_depth: -1
        min_child_samples: 40
        subsample: 0.9
        colsample_bytree: 0.9
        reg_lambda: 1.0
        imbalance_multiplier: 0.75


paths:
  modeling_foundation_config: "configs/modeling_foundation.yaml"
  feature_dataset: "data/processed/feature_dataset.parquet"
  forecast_targets: "data/processed/target_definition/forecast_target_complete.parquet"
  reports_dir: "reports/modeling/peak_risk/lightgbm"
  docs_dir: "docs/modeling/peak_risk/lightgbm"
  outputs_dir: "outputs/modeling/peak_risk/lightgbm"
  figures_dir: "reports/figures/modeling/peak_risk/lightgbm"
